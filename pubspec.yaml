name: goscameracar
description: Проверка автомобильных пропусков
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  # Camera2 provides the single-plane NV21 stream consumed by ML Kit.
  camera_android: ^0.10.12
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
